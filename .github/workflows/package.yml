name: Release Package

on:
  push:
    tags:
      - "v*.*.*" # 推送版本标签（如 v0.1.0）时触发打包并发布 Release
  workflow_dispatch: # 允许在 GitHub 网页上手动触发构建（仅产出 Artifacts，不发布 Release）

permissions:
  contents: read # 默认最小权限；release 任务单独提权

jobs:
  package:
    name: Build Installer for ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows：NSIS 安装包（bin/ai-remote-workspace-amd64-installer.exe）
          - platform: windows
            os: windows-latest
            artifact_name: win-installer
            artifact_paths:
              - bin/*-installer.exe

          # macOS：Universal DMG（arm64 + amd64）
          - platform: darwin
            os: macos-latest
            artifact_name: mac-installer
            artifact_paths:
              - bin/*.dmg

          # Linux：DEB / RPM / AppImage
          - platform: linux
            os: ubuntu-latest
            artifact_name: linux-installer
            artifact_paths:
              - bin/*.deb
              - bin/*.rpm
              - bin/*.AppImage

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Linux：Wails v3 beta 链接 GTK4 + WebKitGTK 6.0（cgo 经 pkg-config 探测）
      - name: Install Linux Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            squashfs-tools

      # Windows：NSIS 安装包。choco 只把安装目录写进注册表 PATH，后续步骤
      # 进程不会重读注册表 —— 显式写入 $GITHUB_PATH 让 makensis 可见。
      - name: Install Windows Dependencies
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          choco install nsis -y
          $nsis = @("${env:ProgramFiles(x86)}\NSIS", "$env:ProgramFiles\NSIS") |
            Where-Object { Test-Path "$_\makensis.exe" } | Select-Object -First 1
          if (-not $nsis) { throw "makensis.exe not found after choco install" }
          Add-Content -Path $env:GITHUB_PATH -Value $nsis
          Write-Host "makensis dir added to PATH: $nsis"

      # 安装 Wails v3 CLI（固定版本，避免 @latest 版本迁移再次打断发布）
      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.13

      - name: Build and Package
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "darwin" ]; then
            wails3 task darwin:package:universal
            # package:universal 只产出 .app bundle，需再打包为 .dmg
            wails3 task darwin:create:dmg
          elif [ "${{ matrix.platform }}" = "linux" ]; then
            wails3 task linux:package
          else
            wails3 task windows:package
          fi

      # 将安装包上传为构建 Artifacts（手动触发时也可从 Actions 页下载）
      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ join(matrix.artifact_paths, '\n') }}
          if-no-files-found: error

  # 打包全部成功后：汇总安装包 → 生成校验和 → 发布到对应 tag 的 Release assets
  release:
    name: Publish GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 Release 并上传 assets

    steps:
      - name: Download All Installers
        uses: actions/download-artifact@v4
        with:
          pattern: "*-installer"
          merge-multiple: true
          path: dist

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload to Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
